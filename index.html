<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js Physics Simulation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #1e2638 0%, #0c1017 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(18, 24, 38, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 16px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      max-width: 320px;
      pointer-events: auto;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 14px;
    }
    .stats {
      font-size: 0.8rem;
      color: #38bdf8;
      margin-bottom: 12px;
      font-variant-numeric: tabular-nums;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    button:hover {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.45);
    }
    button:active {
      transform: translateY(0);
    }
    button.secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: none;
    }
    button.secondary:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }
    #attribution {
      position: absolute;
      bottom: 16px;
      right: 20px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      z-index: 10;
    }
    #attribution a {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui">
    <h1>3D Physics Playground</h1>
    <p>Click anywhere in 3D space to launch spheres, or use the controls below to interact with gravity, bounce, and restitution.</p>
    <div class="stats" id="ball-count">Active Spheres: 0 / 120</div>
    <div class="buttons">
      <button id="spawn-btn">Spawn Ball</button>
      <button id="rain-btn">Sphere Rain</button>
      <button id="burst-btn">Impulse Explosion</button>
      <button id="clear-btn" class="secondary">Reset</button>
    </div>
  </div>

  <div id="attribution">
    Powered by <strong>Three.js</strong> &bull; Deployed on <strong>Vercel</strong>
  </div>

  <!-- CDN scripts for Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // --- Scene, Camera, Renderer Setup ---
    const container = document.getElementById('canvas-container');
    const ballCountLabel = document.getElementById('ball-count');

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0c1017, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 18, 30);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.02;
    controls.minDistance = 5;
    controls.maxDistance = 80;
    controls.target.set(0, 5, 0);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(15, 30, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 100;
    const d = 25;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0x38bdf8, 1.5, 50);
    pointLight.position.set(-10, 15, -10);
    scene.add(pointLight);

    // --- Arena & Obstacles ---
    const arenaSize = 22;
    const arenaHeight = 12;

    // Floor
    const floorGeo = new THREE.CylinderGeometry(arenaSize, arenaSize, 1, 48);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x182234,
      roughness: 0.35,
      metalness: 0.2
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.position.y = -0.5;
    floor.receiveShadow = true;
    scene.add(floor);

    // Floor Grid Ring Accent
    const ringGeo = new THREE.RingGeometry(arenaSize - 0.3, arenaSize, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.01;
    scene.add(ring);

    // Center Pedestal / Bounce Pillar
    const pillarGeo = new THREE.CylinderGeometry(3.5, 4.5, 2.5, 32);
    const pillarMat = new THREE.MeshStandardMaterial({
      color: 0x2e3b55,
      roughness: 0.2,
      metalness: 0.5
    });
    const pillar = new THREE.Mesh(pillarGeo, pillarMat);
    pillar.position.y = 1.25;
    pillar.receiveShadow = true;
    pillar.castShadow = true;
    scene.add(pillar);

    // Bumper ring on pillar
    const bumperGeo = new THREE.TorusGeometry(3.6, 0.4, 16, 32);
    const bumperMat = new THREE.MeshStandardMaterial({
      color: 0xec4899,
      emissive: 0xec4899,
      emissiveIntensity: 0.4,
      roughness: 0.1
    });
    const bumper = new THREE.Mesh(bumperGeo, bumperMat);
    bumper.position.y = 2.4;
    bumper.rotation.x = Math.PI / 2;
    bumper.castShadow = true;
    scene.add(bumper);

    // Floating kinetic ramps/obstacles
    const obstacles = [];
    const pegGeo = new THREE.CylinderGeometry(0.5, 0.5, 4, 16);
    const pegMat = new THREE.MeshStandardMaterial({ color: 0x6366f1, roughness: 0.3, metalness: 0.4 });

    const pegPositions = [
      [-7, 2, -7], [7, 2, -7], [-7, 2, 7], [7, 2, 7],
      [-11, 2, 0], [11, 2, 0], [0, 2, -11], [0, 2, 11]
    ];

    pegPositions.forEach(pos => {
      const peg = new THREE.Mesh(pegGeo, pegMat);
      peg.position.set(pos[0], pos[1], pos[2]);
      peg.castShadow = true;
      peg.receiveShadow = true;
      scene.add(peg);
      obstacles.push({
        type: 'cylinder',
        mesh: peg,
        radius: 0.5,
        height: 4,
        x: pos[0],
        z: pos[2],
        yBottom: 0,
        yTop: 4
      });
    });

    // --- Particle Physics System ---
    const balls = [];
    const maxBalls = 120;
    const gravity = -24;
    const restitution = 0.72; // Bounciness
    const damping = 0.992;   // Air resistance
    const sphereGeo = new THREE.SphereGeometry(1, 24, 24);

    const colors = [
      0x38bdf8, // Sky Blue
      0xf43f5e, // Rose / Pink
      0xa855f7, // Purple
      0x10b981, // Emerald Green
      0xfbbf24, // Amber Yellow
      0x06b6d4  // Cyan
    ];

    function createBall(x, y, z, vx = 0, vy = 0, vz = 0, radius = 0.85 + Math.random() * 0.4) {
      if (balls.length >= maxBalls) {
        const oldest = balls.shift();
        scene.remove(oldest.mesh);
        oldest.mesh.geometry.dispose();
      }

      const color = colors[Math.floor(Math.random() * colors.length)];
      const ballMat = new THREE.MeshStandardMaterial({
        color: color,
        metalness: 0.15,
        roughness: 0.25
      });

      const mesh = new THREE.Mesh(sphereGeo, ballMat);
      mesh.scale.setScalar(radius);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);

      const ball = {
        mesh: mesh,
        radius: radius,
        position: mesh.position,
        velocity: new THREE.Vector3(vx, vy, vz),
        mass: radius * radius * radius,
        color: color
      };

      balls.push(ball);
      updateBallCount();
      return ball;
    }

    function updateBallCount() {
      ballCountLabel.textContent = `Active Spheres: ${balls.length} / ${maxBalls}`;
    }

    // --- Initial Balls ---
    for (let i = 0; i < 18; i++) {
      const angle = (i / 18) * Math.PI * 2;
      const dist = 6 + Math.random() * 8;
      createBall(
        Math.cos(angle) * dist,
        8 + Math.random() * 12,
        Math.sin(angle) * dist,
        (Math.random() - 0.5) * 5,
        Math.random() * 2,
        (Math.random() - 0.5) * 5
      );
    }

    // --- Physics Update Loop ---
    let lastTime = performance.now();

    function updatePhysics(dt) {
      // Sub-stepping for stable collision response
      const subSteps = 6;
      const subDt = dt / subSteps;

      for (let step = 0; step < subSteps; step++) {
        // Integrate motion
        for (let i = 0; i < balls.length; i++) {
          const b = balls[i];

          b.velocity.y += gravity * subDt;
          b.velocity.x *= Math.pow(damping, subDt * 60);
          b.velocity.z *= Math.pow(damping, subDt * 60);

          b.position.x += b.velocity.x * subDt;
          b.position.y += b.velocity.y * subDt;
          b.position.z += b.velocity.z * subDt;

          // Floor collision
          if (b.position.y - b.radius < 0) {
            b.position.y = b.radius;
            if (b.velocity.y < 0) {
              b.velocity.y = -b.velocity.y * restitution;
              b.velocity.x *= 0.95; // Ground friction
              b.velocity.z *= 0.95;
            }
          }

          // Arena boundary cylinder check
          const distFromCenter = Math.sqrt(b.position.x * b.position.x + b.position.z * b.position.z);
          if (distFromCenter + b.radius > arenaSize) {
            const normalX = b.position.x / distFromCenter;
            const normalZ = b.position.z / distFromCenter;

            // Push back
            const overlap = (distFromCenter + b.radius) - arenaSize;
            b.position.x -= normalX * overlap;
            b.position.z -= normalZ * overlap;

            // Reflect velocity
            const dot = b.velocity.x * normalX + b.velocity.z * normalZ;
            if (dot > 0) {
              b.velocity.x -= (1 + restitution) * dot * normalX;
              b.velocity.z -= (1 + restitution) * dot * normalZ;
            }
          }

          // Central Pedestal collision (Cylinder at 0, 0, radius 3.5, height 2.5)
          const centerDist = Math.sqrt(b.position.x * b.position.x + b.position.z * b.position.z);
          if (centerDist < 3.5 + b.radius && b.position.y < 2.5 + b.radius) {
            if (b.position.y >= 2.5) {
              // Top of pillar
              b.position.y = 2.5 + b.radius;
              if (b.velocity.y < 0) b.velocity.y = -b.velocity.y * (restitution + 0.15); // Extra spring
            } else {
              // Side of pillar
              const nx = b.position.x / (centerDist || 1);
              const nz = b.position.z / (centerDist || 1);
              const push = (3.5 + b.radius) - centerDist;
              b.position.x += nx * push;
              b.position.z += nz * push;
              const dot = b.velocity.x * nx + b.velocity.z * nz;
              if (dot < 0) {
                b.velocity.x -= (1 + restitution * 1.3) * dot * nx;
                b.velocity.z -= (1 + restitution * 1.3) * dot * nz;
              }
            }
          }

          // Obstacle Pegs
          for (let k = 0; k < obstacles.length; k++) {
            const obs = obstacles[k];
            const dx = b.position.x - obs.x;
            const dz = b.position.z - obs.z;
            const pegDist = Math.sqrt(dx * dx + dz * dz);
            const minPegDist = obs.radius + b.radius;
            if (pegDist < minPegDist && b.position.y < obs.yTop + b.radius) {
              const nx = dx / pegDist;
              const nz = dz / pegDist;
              const overlap = minPegDist - pegDist;
              b.position.x += nx * overlap;
              b.position.z += nz * overlap;
              const dot = b.velocity.x * nx + b.velocity.z * nz;
              if (dot < 0) {
                b.velocity.x -= (1 + restitution * 1.2) * dot * nx;
                b.velocity.z -= (1 + restitution * 1.2) * dot * nz;
              }
            }
          }
        }

        // Ball-to-Ball Elastic Collisions
        for (let i = 0; i < balls.length; i++) {
          const b1 = balls[i];
          for (let j = i + 1; j < balls.length; j++) {
            const b2 = balls[j];

            const dx = b2.position.x - b1.position.x;
            const dy = b2.position.y - b1.position.y;
            const dz = b2.position.z - b1.position.z;
            const distSq = dx * dx + dy * dy + dz * dz;
            const minDist = b1.radius + b2.radius;

            if (distSq < minDist * minDist && distSq > 0.0001) {
              const dist = Math.sqrt(distSq);
              const nx = dx / dist;
              const ny = dy / dist;
              const nz = dz / dist;

              // Positional separation
              const overlap = minDist - dist;
              const totalMass = b1.mass + b2.mass;
              const m1Ratio = b2.mass / totalMass;
              const m2Ratio = b1.mass / totalMass;

              b1.position.x -= nx * overlap * m1Ratio;
              b1.position.y -= ny * overlap * m1Ratio;
              b1.position.z -= nz * overlap * m1Ratio;

              b2.position.x += nx * overlap * m2Ratio;
              b2.position.y += ny * overlap * m2Ratio;
              b2.position.z += nz * overlap * m2Ratio;

              // Velocity impulse
              const kx = b1.velocity.x - b2.velocity.x;
              const ky = b1.velocity.y - b2.velocity.y;
              const kz = b1.velocity.z - b2.velocity.z;
              const p = 2 * (nx * kx + ny * ky + nz * kz) / totalMass;

              b1.velocity.x -= p * b2.mass * nx * restitution;
              b1.velocity.y -= p * b2.mass * ny * restitution;
              b1.velocity.z -= p * b2.mass * nz * restitution;

              b2.velocity.x += p * b1.mass * nx * restitution;
              b2.velocity.y += p * b1.mass * ny * restitution;
              b2.velocity.z += p * b1.mass * nz * restitution;
            }
          }
        }
      }
    }

    // --- Interactive User Controls ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    window.addEventListener('pointerdown', (e) => {
      // Don't trigger when clicking the UI card
      if (e.target.closest('#ui') || e.target.closest('#attribution')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const targetPoint = new THREE.Vector3();
      raycaster.ray.intersectPlane(plane, targetPoint);

      if (targetPoint && targetPoint.length() < arenaSize) {
        createBall(
          targetPoint.x,
          Math.max(12, targetPoint.y + 10),
          targetPoint.z,
          (Math.random() - 0.5) * 6,
          -4,
          (Math.random() - 0.5) * 6
        );
      }
    });

    // Buttons
    document.getElementById('spawn-btn').addEventListener('click', () => {
      createBall(
        (Math.random() - 0.5) * 8,
        15 + Math.random() * 5,
        (Math.random() - 0.5) * 8,
        (Math.random() - 0.5) * 8,
        -2,
        (Math.random() - 0.5) * 8
      );
    });

    let rainInterval = null;
    document.getElementById('rain-btn').addEventListener('click', () => {
      if (rainInterval) {
        clearInterval(rainInterval);
        rainInterval = null;
        document.getElementById('rain-btn').textContent = 'Sphere Rain';
        return;
      }
      document.getElementById('rain-btn').textContent = 'Stop Rain';
      let spawned = 0;
      rainInterval = setInterval(() => {
        if (balls.length >= maxBalls || spawned >= 40) {
          clearInterval(rainInterval);
          rainInterval = null;
          document.getElementById('rain-btn').textContent = 'Sphere Rain';
          return;
        }
        const angle = Math.random() * Math.PI * 2;
        const rad = Math.random() * (arenaSize - 3);
        createBall(
          Math.cos(angle) * rad,
          20 + Math.random() * 6,
          Math.sin(angle) * rad,
          (Math.random() - 0.5) * 4,
          -6,
          (Math.random() - 0.5) * 4
        );
        spawned++;
      }, 100);
    });

    document.getElementById('burst-btn').addEventListener('click', () => {
      // Create radial impulse blast from center
      balls.forEach(b => {
        const dx = b.position.x;
        const dy = b.position.y - 1;
        const dz = b.position.z;
        const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy + dz * dz));
        const power = 35 / dist;
        b.velocity.x += (dx / dist) * power + (Math.random() - 0.5) * 4;
        b.velocity.y += Math.max(10, (dy / dist) * power * 0.8) + 12;
        b.velocity.z += (dz / dist) * power + (Math.random() - 0.5) * 4;
      });
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      balls.forEach(b => {
        scene.remove(b.mesh);
        b.mesh.geometry.dispose();
      });
      balls.length = 0;
      updateBallCount();
    });

    // Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Animation Loop ---
    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      updatePhysics(dt);

      // Subtle bumper pulse animation
      bumper.rotation.z += 0.01;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
