<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js Physics Simulation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui">
    <h1>3D Physics Playground</h1>
    <p>Click anywhere in 3D space to launch spheres, or use the controls below to interact with gravity, bounce, and restitution.</p>
    <div class="stats" id="ball-count">Active Spheres: 0 / 120</div>
    <div class="buttons">
      <button id="spawn-btn">Spawn Ball</button>
      <button id="rain-btn">Sphere Rain</button>
      <button id="burst-btn">Impulse Explosion</button>
      <button id="clear-btn" class="secondary">Reset</button>
    </div>
  </div>

  <div id="attribution">
    Powered by <strong>Three.js</strong> &bull; Deployed on <strong>Vercel</strong>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script src="scene_setup.js"></script>
  <script src="scene_arena.js"></script>
  <script src="physics_particles.js"></script>
  <script src="physics_env.js"></script>
  <script src="physics_balls.js"></script>
  <script src="physics_engine.js"></script>
  <script src="controls.js"></script>
</body>
</html>
